<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Caída de Tensión (Vp) con Gráfico</title>
    <!-- Incluir la librería Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Incluir el plugin de anotaciones de Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/2.2.1/chartjs-plugin-annotation.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="number"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            border: none;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        .results {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            text-align: center;
        }
        .results p {
            font-size: 1.2em;
            color: #333;
        }
        .results span, .warning-message span {
            font-weight: bold;
            color: #007bff;
        }
        .warning-message {
            margin-top: 10px;
            padding: 10px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            border-radius: 5px;
            text-align: center;
        }
        #chartContainer {
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora de Caída de Tensión (Vp)</h2>

    <div class="input-group">
        <label for="tipoCalculo">Tipo de Sistema:</label>
        <select id="tipoCalculo">
            <option value="monofasico">Monofásico (220V)</option>
            <option value="trifasico">Trifásico (380V)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="S">Sección del Conductor (S):</label>
        <input type="number" id="S" placeholder="mm²">
    </div>

    <div class="input-group">
        <label for="L">Longitud Máxima (L):</label>
        <input type="number" id="L" placeholder="Metros">
    </div>

    <div class="input-group">
        <label for="I">Corriente (I):</label>
        <input type="number" id="I" placeholder="Amperes">
    </div>

    <div class="button-group">
        <button onclick="calcularYGraficarVp()">Calcular y Graficar</button>
    </div>

    <div class="results" id="resultadoDiv" style="display: none;">
        <p>Caída de Tensión (Vp) a <span id="longitudFinal"></span> metros: <span id="resultadoValor"></span></p>
        <div id="advertenciaCruce" class="warning-message" style="display: none;"></div>
    </div>

    <div id="chartContainer">
        <canvas id="vpChart"></canvas>
    </div>
</div>

<script>
    let miGrafico;

    function calcularYGraficarVp() {
        const tipoSistema = document.getElementById('tipoCalculo').value;
        const S = parseFloat(document.getElementById('S').value);
        const L_max = parseFloat(document.getElementById('L').value);
        const I = parseFloat(document.getElementById('I').value);

        if (isNaN(S) || isNaN(L_max) || isNaN(I) || S <= 0 || L_max <= 0) {
            alert("Por favor, ingrese valores válidos y mayores que cero.");
            return;
        }

        const tensionNominal = (tipoSistema === 'monofasico') ? 220 : 380;
        const limiteVp = tensionNominal * 0.03;
        const constanteK = (tipoSistema === 'monofasico') ? 2 * 0.018 : Math.sqrt(3) * 0.018;

        const vp_final = (constanteK * L_max * I) / S;

        document.getElementById('resultadoDiv').style.display = 'block';
        document.getElementById('longitudFinal').textContent = L_max;
        document.getElementById('resultadoValor').textContent = `${vp_final.toFixed(2)} Volts`;
        
        const advertenciaDiv = document.getElementById('advertenciaCruce');
        let longitudCruce = null;

        // Generar puntos de datos base
        let dataPoints = [];
        const numeroDePuntos = Math.min(L_max, 100);
        for (let i = 0; i <= numeroDePuntos; i++) {
            const l_actual = (L_max / numeroDePuntos) * i;
            dataPoints.push({
                x: l_actual,
                y: (constanteK * l_actual * I) / S
            });
        }
        
        if (vp_final > limiteVp) {
            longitudCruce = (limiteVp * S) / (constanteK * I);
            advertenciaDiv.innerHTML = `La sección no cumple. El límite del 3% se alcanza a los <span>${longitudCruce.toFixed(2)} metros</span>.`;
            advertenciaDiv.style.display = 'block';
            
            // NUEVO: Añadir el punto de cruce exacto a los datos
            dataPoints.push({ x: longitudCruce, y: limiteVp });
            // Ordenar los puntos por longitud (eje x) para que la línea se dibuje correctamente
            dataPoints.sort((a, b) => a.x - b.x);

        } else {
            advertenciaDiv.style.display = 'none';
        }

        const etiquetas = dataPoints.map(p => p.x.toFixed(2));
        const datosVp = dataPoints.map(p => p.y.toFixed(4));

        if (miGrafico) {
            miGrafico.destroy();
        }

        const annotations = {
            limiteHorizontal: {
                type: 'line',
                yMin: limiteVp,
                yMax: limiteVp,
                borderColor: 'red',
                borderWidth: 2,
                borderDash: [10, 5],
                label: {
                    content: `Límite 3% (${limiteVp.toFixed(2)} V)`,
                    enabled: true,
                    position: 'end',
                    backgroundColor: 'rgba(255, 99, 132, 0.8)'
                }
            },
            puntoInicial: {
                type: 'point',
                xValue: etiquetas[0],
                yValue: datosVp[0],
                backgroundColor: 'rgba(0, 0, 0, 0.7)',
                radius: 5,
            },
            labelInicial: {
                type: 'label',
                xValue: etiquetas[0],
                yValue: datosVp[0],
                content: ['0 m', `${parseFloat(datosVp[0]).toFixed(2)} V`],
                font: { size: 10 },
                xAdjust: -20,
                yAdjust: -20,
            },
            puntoFinal: {
                type: 'point',
                xValue: etiquetas[etiquetas.length-1],
                yValue: datosVp[datosVp.length-1],
                backgroundColor: 'rgba(0, 0, 0, 0.7)',
                radius: 5,
            },
            labelFinal: {
                type: 'label',
                xValue: etiquetas[etiquetas.length-1],
                yValue: datosVp[datosVp.length-1],
                content: [`${L_max.toFixed(2)} m`, `${vp_final.toFixed(2)} V`],
                font: { size: 10 },
                xAdjust: 20,
                yAdjust: 20,
            }
        };
        
        if (longitudCruce !== null) {
            // Usar el valor numérico exacto para xValue
            const cruceX = longitudCruce.toFixed(2);
            annotations.limiteVertical = {
                type: 'line',
                xMin: cruceX,
                xMax: cruceX,
                borderColor: 'orange',
                borderWidth: 2,
                borderDash: [5, 5],
            };
            annotations.puntoCruce = {
                type: 'point',
                xValue: cruceX,
                yValue: limiteVp,
                backgroundColor: 'red',
                borderColor: 'darkred',
                borderWidth: 2,
                radius: 6,
            };
             annotations.labelCruce = {
                type: 'label',
                xValue: cruceX,
                yValue: limiteVp,
                content: `${cruceX} m`,
                font: { size: 10 },
                backgroundColor: 'rgba(255, 165, 0, 0.8)',
                yAdjust: -20
            };
        }
        
        miGrafico = new Chart(document.getElementById('vpChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: etiquetas,
                datasets: [{
                    label: 'Caída de Tensión (Vp)',
                    data: datosVp,
                    borderColor: 'rgba(40, 167, 69, 1)',
                    backgroundColor: 'rgba(40, 167, 69, 0.2)',
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'Evolución de la Caída de Tensión vs. Longitud' },
                    annotation: { annotations: annotations }
                },
                scales: {
                    x: { title: { display: true, text: 'Longitud (Metros)' }},
                    y: { title: { display: true, text: 'Caída de Tensión (Volts)' }, beginAtZero: true }
                }
            }
        });
    }
</script>

</body>
</html>
