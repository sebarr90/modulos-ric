<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Informes Eléctricos</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { background: #f5f6fa; }
    .card { border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .preview { max-width: 200px; margin-top: 10px; }
  </style>
</head>
<body class="container py-4">

  <h1 class="text-center text-primary mb-4">Generador de Informes Eléctricos</h1>

  <!-- Selector de tipo de informe -->
  <div class="card p-4 mb-4">
    <h4 class="mb-3">Tipo de Informe</h4>
    <select id="tipoInforme" class="form-select">
      <option value="ric">Declaración RIC N°18</option>
      <option value="visita">Visita Técnica</option>
    </select>
  </div>

  <!-- Datos Generales -->
  <div class="card p-4 mb-4">
    <h4 class="mb-3">Datos Generales</h4>
    <form id="generalForm">
      <div class="mb-3">
        <label class="form-label">Nombre del Proyecto</label>
        <input type="text" id="proyecto" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label" id="labelInstalador">Instalador</label>
        <input type="text" id="instalador" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label" id="labelUbicacion">Ubicación del Proyecto</label>
        <input type="text" id="ubicacion" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Fecha</label>
        <input type="text" id="fecha" class="form-control" readonly>
      </div>
    </form>
  </div>

  <!-- Fotos -->
  <div class="card p-4 mb-4">
    <h4 class="mb-3">Agregar Fotos</h4>
    <form id="photoForm">
      <div class="mb-3">
        <label class="form-label">Categoría</label>
        <select id="categoria" class="form-select" required></select>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <input type="text" id="descripcion" class="form-control" placeholder="Ej: Tablero TDA1 en living" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Foto</label>
        <input type="file" id="foto" class="form-control" accept="image/*" capture="environment" required>
      </div>
      <button type="submit" class="btn btn-primary">Agregar al informe</button>
    </form>
  </div>

  <!-- Lista -->
  <div class="card p-4 mb-4">
    <h4 class="mb-3">Fotos agregadas</h4>
    <div id="photoList" class="photo-list"></div>
  </div>

  <!-- Botón PDF -->
  <div class="text-center">
    <button id="generatePDF" class="btn btn-success btn-lg">Generar Informe PDF</button>
  </div>

  <script>
    const photoList = document.getElementById("photoList");
    const fechaInput = document.getElementById("fecha");
    const tipoInformeSelect = document.getElementById("tipoInforme");
    const categoriaSelect = document.getElementById("categoria");
    const labelInstalador = document.getElementById("labelInstalador");
    const labelUbicacion = document.getElementById("labelUbicacion");
    const fotos = [];

    // Fecha automática
    const hoy = new Date().toLocaleDateString("es-CL", { day: '2-digit', month: '2-digit', year: 'numeric' });
    fechaInput.value = hoy;

    // Categorías dinámicas según tipo de informe
    const categoriasRIC = [
      "Numeración de la propiedad",
      "Tablero general",
      "Tablero de distribución",
      "Canalización aérea",
      "Canalización subterránea",
      "Sistema de puesta a tierra",
      "Aparatos eléctricos",
      "Equipos de iluminación",
      "Respaldo de energía"
    ];

    const categoriasVisita = [
      "Tableros eléctricos",
      "Canalizaciones",
      "Equipos de protección",
      "Problemas detectados",
      "Recomendaciones",
      "Otros"
    ];

    function cargarCategorias() {
      categoriaSelect.innerHTML = "";
      let categorias = tipoInformeSelect.value === "ric" ? categoriasRIC : categoriasVisita;
      categorias.forEach(cat => {
        let opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        categoriaSelect.appendChild(opt);
      });

      // Cambiar etiquetas según tipo
      if (tipoInformeSelect.value === "ric") {
        labelInstalador.textContent = "Instalador (autorizado SEC)";
        labelUbicacion.textContent = "Ubicación del Proyecto";
      } else {
        labelInstalador.textContent = "Técnico Responsable";
        labelUbicacion.textContent = "Dirección del Cliente";
      }
    }

    tipoInformeSelect.addEventListener("change", cargarCategorias);
    cargarCategorias(); // inicial

    // Agregar fotos
    document.getElementById("photoForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const categoria = document.getElementById("categoria").value;
      const descripcion = document.getElementById("descripcion").value;
      const fotoInput = document.getElementById("foto");
      const file = fotoInput.files[0];

      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const fotoData = {
          categoria,
          descripcion,
          src: event.target.result
        };
        fotos.push(fotoData);

        const div = document.createElement("div");
        div.className = "photo-item mb-3";
        div.innerHTML = `
          <div class="border rounded p-2">
            <strong>Categoría:</strong> ${categoria}<br>
            <strong>Descripción:</strong> ${descripcion}<br>
            <img src="${event.target.result}" class="preview mt-2">
          </div>
        `;
        photoList.appendChild(div);
      };
      reader.readAsDataURL(file);

      e.target.reset();
    });

    // Generar PDF
    document.getElementById("generatePDF").addEventListener("click", () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Datos generales
      const tipoInforme = tipoInformeSelect.value;
      const proyecto = document.getElementById("proyecto").value;
      const instalador = document.getElementById("instalador").value;
      const ubicacion = document.getElementById("ubicacion").value;
      const fecha = fechaInput.value;

      // Portada
      doc.setFontSize(20);
      if (tipoInforme === "ric") {
        doc.text("Informe de Imágenes", 70, 40);
        doc.setFontSize(14);
        doc.text("Declaración de Instalación Eléctrica según RIC N°18", 20, 55);
      } else {
        doc.text("Informe de Visita Técnica", 65, 40);
        doc.setFontSize(14);
        doc.text("Evaluación de Instalación Eléctrica", 20, 55);
      }

      doc.setFontSize(12);
      doc.text(`Proyecto: ${proyecto}`, 20, 75);
      doc.text(`${labelInstalador.textContent}: ${instalador}`, 20, 85);
      doc.text(`${labelUbicacion.textContent}: ${ubicacion}`, 20, 95);
      doc.text(`Fecha: ${fecha}`, 20, 105);
      doc.line(20, 110, 190, 110);

      // Fotos
      if (fotos.length > 0) {
        doc.addPage();
        let y = 20;
        fotos.forEach((foto) => {
          doc.setFontSize(14);
          doc.text(`${foto.categoria}`, 20, y);
          y += 10;
          doc.setFontSize(12);
          doc.text(`${foto.descripcion}`, 20, y);
          y += 10;
          doc.addImage(foto.src, "JPEG", 20, y, 160, 90);
          y += 100;

          if (y > 250) {
            doc.addPage();
            y = 20;
          }
        });
      }

      const fileName = tipoInforme === "ric" ? "informe-ric.pdf" : "informe-visita.pdf";
      doc.save(fileName);
    });
  </script>

</body>
</html>
